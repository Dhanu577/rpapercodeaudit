[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpapercodeaudit"
version = "0.1.0"
description = "Human-in-the-loop paper-code consistency annotation helper"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "streamlit>=1.30",
  "GitPython>=3.1",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["rpapercodeaudit*"]
